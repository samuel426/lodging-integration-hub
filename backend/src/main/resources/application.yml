spring:
  application:
    name: lodging-integration-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lodging_hub}
    username: ${DB_USERNAME:lodging}
    password: ${DB_PASSWORD:lodging_local}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
